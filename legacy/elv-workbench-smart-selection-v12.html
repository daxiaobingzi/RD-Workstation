*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  background:
    radial-gradient(1200px 620px at 78% -12%,var(--glow-a),transparent 60%),
    radial-gradient(900px 520px at 8% 112%,var(--glow-b),transparent 60%),
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),
    var(--bg);
  background-size:auto,auto,34px 34px,34px 34px,auto;
  color:var(--text);font-size:15px;line-height:1.55;
  transition:background-color .3s ease,color .3s ease}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);border:1px solid var(--input-border);border-radius:10px;padding:10px 12px;background:var(--input-bg);width:100%;outline:none;transition:border .15s,box-shadow .15s,background-color .3s,color .3s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--input-focus-ring)}
select option{background:var(--bg2);color:var(--text)}
::placeholder{color:var(--text3)}
textarea{resize:vertical;min-height:72px}
label{font-size:13px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--scroll-track)}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px;border:2px solid var(--scroll-track)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}

/* ===== 布局骨架 ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:216px;background:var(--sb-bg);border-right:1px solid var(--sb-line);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:30;transition:background-color .3s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--sb-line)}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6a5fc1 0%,#8b5cf6 48%,#F54E00 135%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:var(--brand-logo-shadow);transition:box-shadow .3s}
.brand-name{font-weight:700;font-size:15px;line-height:1.25;color:var(--brand-text);letter-spacing:.2px;transition:color .3s}
.brand-sub{font-size:11px;color:var(--sb-text)}
.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-size:14.5px;color:var(--sb-text);font-weight:500;transition:all .18s ease;position:relative}
.nav-item svg{width:20px;height:20px;flex-shrink:0;transition:color .18s,transform .18s}
.nav-item:hover{background:var(--sb-hover);color:var(--strong-text)}
.nav-item:hover svg{color:var(--orange);transform:scale(1.1)}
.nav-item.active{background:var(--nav-active-bg);color:var(--on-primary);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item.active svg{color:inherit;opacity:.9}
.side-foot{padding:14px 16px;border-top:1px solid var(--sb-line);font-size:12px;color:var(--sb-text)}
.sync-state{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.sync-state .dot{width:8px;height:8px;border-radius:50%;background:var(--sync-on);box-shadow:0 0 8px var(--sync-on-glow);transition:background-color .3s}
.sync-state .dot.off{background:var(--sync-off);box-shadow:0 0 8px var(--sync-off-glow)}
.sync-state .dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.main{flex:1;margin-left:216px;padding:22px 28px 90px;max-width:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:21px;font-weight:700;letter-spacing:.2px;background:var(--title-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.topbar-actions:empty{margin-left:0}

/* 三态主题切换按钮 */
.theme-switch{display:inline-flex;align-items:center;gap:2px;background:var(--theme-switch-bg);border:1px solid var(--line2);border-radius:999px;padding:3px;flex-shrink:0;transition:background-color .3s,border-color .3s}
.theme-switch button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text2);transition:all .18s;white-space:nowrap}
.theme-switch button svg{width:15px;height:15px;flex-shrink:0}
.theme-switch button:hover{color:var(--orange)}
.theme-switch button.active{background:var(--primary);color:var(--on-primary);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.theme-switch button.active:hover{color:var(--on-primary)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;transition:background-color .3s,color .3s}
.badge.blue{background:var(--blue-bg);color:var(--blue-ink);border:1px solid var(--blue-line)}
.badge.green{background:var(--green-l);color:var(--green-ink);border:1px solid var(--green-line)}
.badge.gray{background:var(--gray-bg);color:var(--gray-ink);border:1px solid var(--gray-line)}
.badge.red{background:var(--red-l);color:var(--red-ink);border:1px solid var(--red-line)}
.badge.amber{background:var(--amber-l);color:var(--amber-ink);border:1px solid var(--amber-line)}
.badge svg{width:12px;height:12px}

/* 今天要处理（紧凑条） */
.today-card{margin-bottom:16px;padding:0 14px}

.today-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 2px;border-bottom:1px dashed var(--line)}
.today-item:last-child{border-bottom:none}

.today-item .t2{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-item .t2.red{color:var(--red);font-weight:600}

/* 统计卡片（数据仪表盘核心） */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--stat-grad);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s,background-color .3s}
.stat-card:hover{border-color:var(--orange);box-shadow:var(--hover-glow);transform:translateY(-2px)}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor}
.stat-card .num{font-size:26px;font-weight:700;line-height:1.2;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--text)}

.stat-card .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.92;box-shadow:0 4px 12px rgba(0,0,0,.35)}

/* 项目进度条 */
.prog{margin-top:10px}
.prog .prog-bar{height:5px;border-radius:99px;background:var(--prog-track);overflow:hidden}
.prog .prog-fill{height:100%;border-radius:99px;transition:width .35s ease;box-shadow:0 0 8px currentColor}
.prog .prog-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text3);margin-top:4px;font-family:var(--mono)}

/* 项目卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.proj-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:all .2s ease;position:relative}

.proj-card .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}

.tbl-wrap{overflow-x:auto;margin-top:6px}

.tbl .op button:disabled{opacity:.35;cursor:not-allowed}

.drag-handle{display:inline-flex;cursor:grab;color:var(--text3);padding:4px}

#devTbl tr.drop-bottom td{border-bottom:2px solid var(--orange)}
.brand-card{border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--brand-card-bg)}

.param-row input{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:13px;min-height:32px;background:var(--input-bg)}

/* 页签 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--text2);background:var(--glass-1);border:1px solid var(--line2);min-height:38px;transition:all .18s}
.tab:hover{border-color:var(--orange);color:var(--orange)}

/* 表单 */

/* ---------- 数据层（双模式） ---------- */
var online=false,syncBusy=false,syncReady=false,pendingPush=false,lastSync={P:{},PT:{},DV:{},ST:{}};
function hasSDK(){return typeof window!=='undefined'&&window.__SMART_PAGE__&&window.__SMART_PAGE__.database}

  P:{id:DB_PROJECTS,key:LS_P},PT:{id:DB_POINTS,key:LS_PT},DV:{id:DB_DEVICES,key:LS_DV},ST:{id:DB_SETTINGS,key:LS_ST}
};

function lsGet(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* 手动重新拉取云端（点同步状态触发） */
function refreshFromCloud(){
  if(!online||syncBusy)return;
  if(!confirm('重新从云端加载数据？本机未同步的修改将丢失。'))return;
  location.reload();
}

/* 从在线表拉全量（翻页） */
function queryAll(dbId){
  var db=sdk(),out=[],cur=null;
  var DATABASE_ID=dbId;
  function page(cursor){return db.query({databaseId:DATABASE_ID,startCursor:cursor||undefined,pageSize:500}).then(function(r){
    out=out.concat(r.results||[]);
    if(r.hasMore&&r.nextCursor)return page(r.nextCursor);
    return out;})}
  return page();
}
function normRec(r,cols){var o={id:r['ID']||'',_id:r._id};cols.forEach(function(c){o[c]=r[c]});return o}
var COL_TYPES={
  P:{项目名称:'text',项目编号:'text',建筑类型:'text',客户:'text',项目地址:'text',建筑面积:'number',设计阶段:'text',状态:'select',开始日期:'date',预计结束日期:'date',备注:'text',ID:'text'},
  PT:{项目ID:'text',子系统:'text',点位名称:'text',安装位置:'text',设备类型:'text',数量:'number',备注:'text',扩展字段:'text',设备ID:'text',ID:'text'},
  DV:{子系统:'text',设备名称:'text',规格型号:'text',单位:'text',类别:'select',单点定额:'text',配比规则:'text',设备编码:'text',状态:'text',ID:'text'},
  ST:{配置键:'text',配置值:'text',ID:'text'}};
function toProps(tag,o,cols){var p={};cols.forEach(function(c){var v=o[c];if(v==null)v=null;
  var t=COL_TYPES[tag][c];
  if(t==='number')p[c]={number:v==null?null:Number(v)};
  else if(t==='select')p[c]={select:v==null?null:String(v)};
  else if(t==='date')p[c]={date:v?String(v).slice(0,10):null};
  else p[c]={text:v==null?null:String(v)}});
  p['ID']={text:String(o.id)};return p}

/* DV 表键映射：设备对象(英文键) ⇄ 云端行(中文列名) */
var DV_MAP=[['subsystem','子系统'],['name','设备名称'],['spec','规格型号'],['unit','单位'],['category','类别'],['code','设备编码'],['status','状态']];
/* 定额/配比列名用常量间接引用（保持与设备字典表字段一致） */
var K_QUOTA='单点定额',K_RATIO='配比规则';
function devToRow(d){
  var row={id:d.id};
  DV_MAP.forEach(function(m){row[m[1]]=d[m[0]]});
  row[K_QUOTA]=JSON.stringify(d.quota||[]);
  row[K_RATIO]=d.ratio?JSON.stringify(d.ratio):null;
  return row;
}
function rowToDev(o){
  var d={id:o.id,_id:o._id};
  DV_MAP.forEach(function(m){d[m[0]]=o[m[1]]||''});
  d.unit=d.unit||'台';d.category=d.category||'前端设备';
  d.status=d.status||'启用';
  try{d.quota=JSON.parse(o['单点定额'])||[]}catch(e){d.quota=[]}
  try{d.ratio=o['配比规则']?JSON.parse(o['配比规则']):null}catch(e){d.ratio=null}
  return d;
}
/* 为无编码的存量设备自动补齐稳定编码（DV-0001 起，避免重复） */
function ensureDeviceCodes(){
  var used={},idx=1;
  state.devices.forEach(function(d){if(d.code)used[d.code]=1});
  state.devices.forEach(function(d){
    if(!d.code){
      var c;
      do{c='DV-'+String(idx++).padStart(4,'0')}while(used[c]);
      used[c]=1;d.code=c;
    }
  });
}
/* 设备解析：ID 优先（稳定外键），名称兜底（兼容存量/历史值） */
function resolveDevice(sub,name,devId){
  if(devId){
    var d=state.devices.find(function(x){return x.id===devId});
    if(d)return d;
  }
  if(sub&&name)return state.devices.find(function(d){return d.subsystem===sub&&d.name===name});
  if(name)return state.devices.find(function(d){return d.name===name});
  return null;
}
/* 存量点表回填 deviceId：无设备ID的按 子系统+设备类型 名称匹配补上 */
function backfillPointDeviceIds(){
  state.points.forEach(function(pt){
    if(!pt['设备ID']){
      var dv=resolveDevice(pt.子系统,pt.设备类型,null);
      if(dv)pt['设备ID']=dv.id;
    }
  });
}

/* 在线全量加载 → state */
function loadOnline(){
  var colsP=['项目名称','项目编号','建筑类型','客户','项目地址','建筑面积','设计阶段','状态','开始日期','预计结束日期','备注'];
  var colsPT=['项目ID','子系统','点位名称','安装位置','设备类型','数量','备注','扩展字段','设备ID'];
  var colsDV=['子系统','设备名称','规格型号','单位','类别','单点定额','配比规则','设备编码','状态'];
  var colsST=['配置键','配置值'];
  return Promise.all([queryAll(DB_PROJECTS),queryAll(DB_POINTS),queryAll(DB_DEVICES),queryAll(DB_SETTINGS)])
  .then(function(rs){
    var projects=rs[0].map(function(r){return normRec(r,colsP)}).map(function(p){if(p.开始日期&&p.开始日期.length>10)p.开始日期=p.开始日期.slice(0,10);if(p.预计结束日期&&p.预计结束日期.length>10)p.预计结束日期=p.预计结束日期.slice(0,10);return p});
    var points=rs[1].map(function(r){var o=normRec(r,colsPT);o.数量=Number(r['数量'])||0;return o});
    var devices=rs[2].map(function(r){return rowToDev(normRec(r,colsDV))}).filter(function(d){return d.name});
    ensureDeviceCodes();
    backfillPointDeviceIds();
    var stRecs=rs[3].map(function(r){return normRec(r,colsST)});
    // 建立同步快照
    lastSync={P:{},PT:{},DV:{},ST:{}};
    projects.forEach(function(r){lastSync.P[r.id]={_id:r._id}});
    points.forEach(function(r){lastSync.PT[r.id]={_id:r._id}});
    devices.forEach(function(r){lastSync.DV[r.id]={_id:r._id}});
    stRecs.forEach(function(r){lastSync.ST[r.id]={_id:r._id}});
    return {projects:projects,points:points,devices:devices,stRecs:stRecs};
  });
}

/* 在线保存：按业务 ID diff 同步单表 */
function syncTable(tag,recs){
  var db=sdk(),snap=lastSync[tag],seen={},ops=[],DATABASE_ID=DB[tag].id;
  recs.forEach(function(r){seen[r.id]=1;
    var row=(tag==='DV')?devToRow(r):r;
    if(snap[r.id]){ops.push(db.updateRecord({databaseId:DATABASE_ID,recordId:snap[r.id]._id,properties:toProps(tag,row,colsOf(tag))}));}
    else{ops.push(db.addRecord({databaseId:DATABASE_ID,properties:toProps(tag,row,colsOf(tag))}).then(function(res){
        lastSync[tag][r.id]={_id:(res&&res.id)||(res&&res._id)||r.id};}));}
  });
  Object.keys(snap).forEach(function(id){if(!seen[id]){ops.push(db.deleteRecord({databaseId:DATABASE_ID,recordId:snap[id]._id}).then(function(){delete lastSync[tag][id]}));}});
  return Promise.all(ops);
}
function colsOf(tag){if(tag==='P')return ['项目名称','项目编号','建筑类型','客户','项目地址','建筑面积','设计阶段','状态','开始日期','预计结束日期','备注'];
  if(tag==='PT')return ['项目ID','子系统','点位名称','安装位置','设备类型','数量','备注','扩展字段','设备ID'];
  if(tag==='DV')return ['子系统','设备名称','规格型号','单位','类别','单点定额','配比规则','设备编码','状态'];
  return ['配置键','配置值']}

/* ---------- 保存链路（三层：本地 → 云端 → 状态反馈） ----------
   业务修改 → saveLocal(本地必存) → saveRemote(云端，失败 reject) → 状态展示
   同步失败不再被静默吞掉：UI 明确显示「同步失败」，关键链路可向上抛错触发回滚 */
function saveLocal(){
  lsSet(LS_P,state.projects);lsSet(LS_PT,state.points);lsSet(LS_DV,state.devices);lsSet(LS_ST,state.settings);
}
function saveRemote(){
  if(!online)return Promise.resolve();
  setSync('busy','同步中…');
  return Promise.all([syncTable('P',state.projects),syncTable('PT',state.points),syncTable('DV',state.devices),syncTable('ST',stRecs())]);
}
/* 统一保存入口：本地必存，云端尽力
   - 云端就绪前（首次加载未完成）只写本地，避免基于旧快照误删云端数据
   - 云端失败：明确横幅提示 + 可重试，数据不丢（已存本机）
   opts.throw=true 时同步失败向上抛错（供设备排序等「失败回滚」链路使用） */
function saveAll(opts){
  opts=opts||{};
  saveLocal();
  if(!online){setSync('off','离线模式');return Promise.resolve()}
  if(!syncReady){pendingPush=true;setSync('busy','同步中…');return Promise.resolve()}

    setSync('','已同步');hideBanner();refreshToday();
  }).catch(function(err){
    setSync('off','同步失败');
    showBanner('云端同步失败','数据已保存在本机不会丢失，请检查网络后重试。',function(){saveAll(opts)});
    console.warn('[elv] 云端同步失败：',(err&&err.message)||err);
    if(opts.throw)throw err;
  });
}

/* 应用模板：生成设备字典（不重复）+ 前端设备点表骨架，模板子系统自动补入；点表幂等（重复应用不产生重复行） */
function applyTemplate(tpl,p){
  var addDev=0,addPt=0,skipPt=0;
  tpl.subsystems.forEach(function(s){
    if(!state.settings.subsystems.some(function(x){return x.name===s.name}))
      state.settings.subsystems.push({id:uid('sp'),name:s.name,category:'未分类',fields:[]});
    s.devices.forEach(function(d){
      var exDev=state.devices.find(function(x){return x.subsystem===s.name&&x.name===d.name});
      if(!exDev){exDev={id:uid('dv'),subsystem:s.name,name:d.name,spec:d.spec||'',unit:d.unit||'台',category:d.category||'前端设备',quota:d.quota||[],ratio:d.ratio||null};state.devices.push(exDev);addDev++}
      ensureDesignQuotas();
      if(d.designQuota){
        var dq=Object.assign({},d.designQuota,{id:uid('dqrule'),subsystem:s.name,deviceId:exDev.id,buildingType:d.designQuota.buildingType||tpl.建筑类型||'全部业态'});
        state.settings.designQuotas=state.settings.designQuotas.filter(function(x){return !(x.subsystem===dq.subsystem&&x.deviceId===dq.deviceId&&x.buildingType===dq.buildingType)});state.settings.designQuotas.push(dq);
      }
      if(d.category==='前端设备'){
        var dup=state.points.some(function(x){return x.项目ID===p.id&&(x['设备ID']===exDev.id||(x.子系统===s.name&&x.设备类型===d.name))});
        if(!dup){state.points.push({id:uid('dq'),项目ID:p.id,子系统:s.name,点位名称:'',安装位置:'',设备类型:d.name,设备ID:exDev.id,数量:0,备注:'模板生成',updatedAt:todayStr()});addPt++}
        else skipPt++;
      }
    });
  });
  return {addDev:addDev,addPt:addPt,skipPt:skipPt};
}
/* 存为模板：只提取当前项目实际使用的子系统与设备（含定额/配比），不再全量扫设备字典 */
function saveProjectAsTemplate(p){
  var nm=prompt('模板名称：',p.项目名称+'模板');
  if(nm==null)return;nm=nm.trim();if(!nm)return;
  var used={};
  state.points.filter(function(x){return x.项目ID===p.id}).forEach(function(x){
    if(!used[x.子系统])used[x.子系统]={};
    used[x.子系统][x.设备类型]=1;
  });
  var subNames=Object.keys(used);
  if(!subNames.length){toast('该项目暂无设备点表，无法生成模板');return}
  var tpl={id:uid('tpl'),name:nm,建筑类型:p.建筑类型||'',subsystems:subNames.map(function(sn){
    var ds=state.devices.filter(function(d){return d.subsystem===sn&&used[sn][d.name]}).map(function(d){
      var qr=quotaRuleFor(sn,d.id,p.建筑类型);return {name:d.name,spec:d.spec||'',unit:d.unit||'',category:d.category||'前端设备',quota:d.quota||[],ratio:d.ratio||null,designQuota:qr?JSON.parse(JSON.stringify(qr)):null}
    });
    return {name:sn,devices:ds};
  }).filter(function(s){return s.devices.length})};
  if(!tpl.subsystems.length){toast('该项目点表对应的设备字典已缺失，无法生成模板');return}
  state.settings.templates=state.settings.templates||[];
  state.settings.templates.push(tpl);
  saveAll().then(function(){toast('已保存为模板「'+nm+'」（'+tpl.subsystems.length+' 子系统 / '+tpl.subsystems.reduce(function(a,s){return a+s.devices.length},0)+' 台设备）')});
}

function ensureDesignQuotas(){

  state.settings.designQuotas.forEach(function(r){r.id=r.id||uid('dqrule');r.min=Number(r.min)||0;r.max=Number(r.max)||0;r.per=Number(r.per)||1;r.method=r.method||'area';r.buildingType=r.buildingType||'全部业态'});
}
function quotaRuleFor(sub,deviceId,buildingType){
  ensureDesignQuotas();var rs=state.settings.designQuotas.filter(function(r){return r.subsystem===sub&&r.deviceId===deviceId});
  var exact=rs.find(function(r){return r.buildingType===buildingType});
  return exact||rs.find(function(r){return r.buildingType==='全部业态'})||rs[0]||null;
}
function calcRuleQty(rule,p){
  if(!rule||!p)return null;var area=Number(p.建筑面积)||0,floors=Number(p.建筑楼层数)||0,rooms=Number(p.房间数)||0,per=Math.max(0.0001,Number(rule.per)||1),q=0;
  if(rule.method==='area')q=area?Math.ceil(area/per):0;
  else if(rule.method==='floor')q=floors?Math.ceil(floors*per):0;
  else if(rule.method==='room')q=rooms?Math.ceil(rooms/per):0;
  else q=Math.ceil(per);
  if(rule.min>0)q=Math.max(q,Number(rule.min));if(rule.max>0)q=Math.min(q,Number(rule.max));return q>0?q:0;
}
function ratioSuggestedQty(d,p,subTotalFront){
  if(!d||!d.ratio)return null;var r=d.ratio,per=Number(r.per)||0;if(per<=0)return null;
  if(r.type==='ratio'){
    var targetQty=0;if(r.targetDeviceId){var pt=state.points.find(function(x){return x.项目ID===p.id&&x['设备ID']===r.targetDeviceId});targetQty=pt?Number(pt.数量)||0:0;}
    else targetQty=subTotalFront;
    return targetQty?Math.ceil(targetQty/per):0;
  }
  return null;
}
function suggestQtyForDevice(p,d,sub){
  var rule=quotaRuleFor(sub,d.id,p.建筑类型);var q=rule?calcRuleQty(rule,p):null;
  if(q==null)q=ratioSuggestedQty(d,p,state.points.filter(function(x){return x.项目ID===p.id&&x.子系统===sub&&(resolveDeviceByPoint(x)||{}).category==='前端设备'}).reduce(function(a,x){return a+(Number(x.数量)||0)},0));
  return {qty:q==null?null:q,rule:rule};
}
function autoQtyImpact(p,sub){
  ensureDesignQuotas();var before=buildBudgetSnapshot(p,ensureSmartBudgetMeta(p).defaultTier,ensureSmartBudgetMeta(p).subsystemTiers,ensureSmartBudgetMeta(p).deviceOverrides);
  var existing={};state.points.filter(function(x){return x.项目ID===p.id&&x.子系统===sub}).forEach(function(x){existing[x['设备ID']||x.设备类型]=x});
  var rows=[],devs=state.devices.filter(function(d){return d.subsystem===sub&&(d.category==='前端设备'||d.category==='后端设备')&&d.status!=='归档'});
  devs.forEach(function(d){var s=suggestQtyForDevice(p,d,sub),cur=existing[d.id]?Number(existing[d.id].数量)||0:0;if(s.qty!=null)rows.push({device:d,current:cur,suggested:s.qty,rule:s.rule});});
  return {before:before,rows:rows};
}

/* 项目真实进度（任务权重模型）：
   基础资料 10% + 设备点表 40% + 施工清单 20% + 设计说明 20% + 校核归档 10% */
function calcProgress(p){
  if(!p)return 0;
  if(p.状态==='已完成'||p.状态==='已归档')return 100;
  var s=0;
  // 基础资料 10%（名称/编号/客户/地址/面积 5 项）
  var base=0;['项目名称','项目编号','客户','项目地址','建筑面积'].forEach(function(k){if(p[k])base++});
  s+=base/5*10;
  // 设备点表 40%（已填有效数量行数 / 总行数）
  var pts=state.points.filter(function(x){return x.项目ID===p.id});
  var filled=pts.filter(function(x){return Number(x.数量)>0}).length;
  if(pts.length)s+=filled/pts.length*40;
  // 施工清单 20%（存在历史清单）
  var bl=normalizeBillList(bills[p.id]);
  if(bl&&bl.length)s+=20;
  // 设计说明 20%（本项目任意子系统有说明）
  var hasNote=false;
  Object.keys(notes||{}).forEach(function(k){if(k.indexOf(p.id+'|')===0&&notes[k])hasNote=true});
  if(hasNote)s+=20;
  // 校核归档 10%（状态推进）
  if(p.状态==='校核中')s+=5;
  if(p.状态==='已完成')s+=10; else if(p.清单状态==='已生成')s+=5;
  return Math.min(99,Math.round(s));
}

function sortedDevs(list){
  var has=list.filter(function(d){return devSort[d.id]!=null});
  var none=list.filter(function(d){return devSort[d.id]==null});
  has.sort(function(a,b){return devSort[a.id]-devSort[b.id]});
  return has.concat(none);
}

/* 按钮排序：上移/下移一行 */
function moveDevRow(expr){
  var parts=expr.split('|'),id=parts[0],dir=parseInt(parts[1])||0;
  var devs=sortedDevs(state.devices.filter(function(d){return d.subsystem===dbSub}));
  var idx=devs.findIndex(function(x){return x.id===id});
  if(idx<0||(dir<0&&idx===0)||(dir>0&&idx===devs.length-1)){toast('已在边界，无法移动');return}
  var tmp=devs[idx];devs[idx]=devs[idx+dir];devs[idx+dir]=tmp;
  commitDevSort(devs);
}
/* 拖拽排序 */
function bindDevDrag(){
  var tbody=document.querySelector('#devTbl tbody');
  if(!tbody)return;
  var dragId=null;
  tbody.querySelectorAll('tr[draggable]').forEach(function(tr){
    tr.addEventListener('dragstart',function(e){
      dragId=tr.getAttribute('data-id');
      tr.classList.add('dragging');
      if(e.dataTransfer)e.dataTransfer.effectAllowed='move';
    });
    tr.addEventListener('dragend',function(){tr.classList.remove('dragging')});
    tr.addEventListener('dragover',function(e){
      e.preventDefault();
      tbody.querySelectorAll('tr').forEach(function(r){r.classList.remove('drop-top','drop-bottom')});
      var rect=tr.getBoundingClientRect();
      tr.classList.add((e.clientY<rect.top+rect.height/2)?'drop-top':'drop-bottom');
    });
    tr.addEventListener('dragleave',function(){tr.classList.remove('drop-top','drop-bottom')});
    tr.addEventListener('drop',function(e){
      e.preventDefault();
      tbody.querySelectorAll('tr').forEach(function(r){r.classList.remove('drop-top','drop-bottom','dragging')});
      if(!dragId||dragId===tr.getAttribute('data-id'))return;
      var devs=sortedDevs(state.devices.filter(function(d){return d.subsystem===dbSub}));
      var from=devs.findIndex(function(x){return x.id===dragId});
      var to=devs.findIndex(function(x){return x.id===tr.getAttribute('data-id')});
      if(from<0||to<0)return;
      var rect=tr.getBoundingClientRect();
      var after=e.clientY>rect.top+rect.height/2;
      var item=devs.splice(from,1)[0];
      var to2=devs.findIndex(function(x){return x.id===tr.getAttribute('data-id')});
      devs.splice(to2+(after?1:0),0,item);
      commitDevSort(devs);
      dragId=null;
    });
  });
}
/* 提交排序：写 devSort + 持久化 + 刷新；失败回滚（saveAll 同步失败会向上抛错，回滚链路真正触发） */
function commitDevSort(devs){
  var before=JSON.stringify(devSort);
  var ns={};
  devs.forEach(function(d,i){ns[d.id]=i});
  devSort=ns;
  lsSet(LS_SORT,devSort);
  saveAll({throw:true}).then(function(){
    toast('排序已保存');render();
  }).catch(function(){
    try{devSort=JSON.parse(before);lsSet(LS_SORT,devSort)}catch(e){}
    toast('排序保存失败，已恢复原顺序');
    render();
  });
}
function ratioText(r){
  if(!r)return '-';
  function tn(){ // target → 设备名称（ID 解析；旧关键词/历史值原样显示）
    if(!r.target||r.target==='*')return '';
    var targetId=r.targetDeviceId||r.target;var d=state.devices.find(function(x){return x.id===targetId});
    return '('+(d?d.name:targetId)+')';
  }
  if(r.type==='point')return '手填';
  if(r.type==='factor')return '×'+r.factor+tn();
  if(r.type==='ratio')return '1/'+r.per+tn();
  if(r.type==='length')return r.per+'m/点'+tn();
  if(r.type==='fixed')return '固定'+r.qty;
  return JSON.stringify(r);
}

/* ---------- 全局搜索（跨项目 / 设备 / 点位，权重打分排序） ---------- */
function globalSearch(kw){
  var k=(kw||'').trim().toLowerCase();
  var out={projects:[],devices:[],points:[]};
  if(!k)return out;
  /* 权重：完整匹配 100 / 名称开头 80 / 名称包含 60 / 规格包含 40 */
  function score(fields,specs){
    var best=0;
    fields.forEach(function(f){var v=String(f||'').toLowerCase();if(!v)return;
      if(v===k)best=Math.max(best,100);
      else if(v.indexOf(k)===0)best=Math.max(best,80);
      else if(v.indexOf(k)>=0)best=Math.max(best,60);
    });
    specs.forEach(function(f){var v=String(f||'').toLowerCase();if(!v)return;
      if(v.indexOf(k)>=0)best=Math.max(best,40);
    });
    return best;
  }
  var ps=[],ds=[],ts=[];
  state.projects.forEach(function(p){
    var sc=score([p.项目名称,p.项目编号,p.客户,p.项目地址],[]);
    if(sc)ps.push({o:p,s:sc});
  });
  state.devices.forEach(function(d){
    var sc=score([d.name,d.subsystem],[d.spec]);
    if(sc)ds.push({o:d,s:sc});
  });
  state.points.forEach(function(x){
    var sc=score([x.设备类型,x.点位名称,x.安装位置,x.子系统],[]);
    if(sc)ts.push({o:x,s:sc});
  });
  ps.sort(function(a,b){return b.s-a.s});ds.sort(function(a,b){return b.s-a.s});ts.sort(function(a,b){return b.s-a.s});
  out.projects=ps.map(function(o){return o.o});
  out.devices=ds.map(function(o){return o.o});
  out.points=ts.map(function(o){return o.o});
  return out;
}

/* ---------- 施工清单生成（推算系统） ---------- */
/* 清单差异对比：按 子系统|类别|名称|规格|单位 归并新旧数量 */
function diffBill(oldRows,newRows){
  function key(r){return (r.sub||'')+'|'+(r.cat||'')+'|'+(r.name||'')+'|'+(r.spec||'')+'|'+(r.unit||'')}
  var om={},nm={};
  oldRows.forEach(function(r){var k=key(r);om[k]=(om[k]||0)+r.qty});
  newRows.forEach(function(r){var k=key(r);nm[k]=(nm[k]||0)+r.qty});
  var added=[],removed=[],changed=[];
  Object.keys(nm).forEach(function(k){if(!om[k])added.push({name:k.split('|')[2],qty:nm[k]})});
  Object.keys(om).forEach(function(k){if(!nm[k])removed.push({name:k.split('|')[2],qty:om[k]})});
  Object.keys(nm).forEach(function(k){if(om[k]!=null&&om[k]!==nm[k])changed.push({name:k.split('|')[2],old:om[k],nw:nm[k]})});
  return {added:added,removed:removed,changed:changed};
}
function genBill(){
  var p=state.projects.find(function(x){return x.id===curProjId});if(!p)return;ensureBusinessMeta();
  var rows=state.points.filter(function(x){return x.项目ID===p.id});if(!rows.length){toast('项目暂无设备数量，无法生成清单');return}
  var gp=state.settings.globalParams,loss=Number(gp.lossRate||0)/100,fac=Number(gp.cableFactor||1),frontQty={},backQty={},mats={};
  rows.forEach(function(r){var dv=resolveDevice(r.子系统,r.设备类型,r['设备ID']),qty=Number(r.数量)||0;if(qty<=0)return;var key=r['设备ID']||r.子系统+'|'+r.设备类型,cat=dv?dv.category:'前端设备';

/* 由清单行反查其子系统：遍历项目点位匹配设备类型（ID 优先） */
function billSubOf(r){
  var pt=r.deviceId?state.points.find(function(x){return x['设备ID']===r.deviceId&&x.项目ID===curProjId}):null;
  if(!pt)pt=state.points.find(function(x){return x.项目ID===curProjId&&x.设备类型===r.name&&x.子系统===r.sub});
  return r.sub||(pt?pt.子系统:'');
}
/* 清单报价估算：设备行取项目/历史快照价格；无快照时取设备默认第一条型号价格；材料行取参考价 */
function calcQuote(bill){
  var bySub={},order=[],devAmt=0,matAmt=0;
  bill.forEach(function(r){
    if(!bySub[r.sub]){bySub[r.sub]={dev:0,mat:0};order.push(r.sub)}
    if(r.cat==='前端设备'||r.cat==='后端设备'){
      var price=r.unitPrice!=null&&r.unitPrice!==''?Number(r.unitPrice):null;
      if(price==null){var dv=resolveDevice(r.sub,r.name,r.deviceId),pp=dv&&devBrands[dv.id]&&devBrands[dv.id][0];price=pp&&pp.unitPrice!=null?Number(pp.unitPrice):null}
      if(price!=null){var amt=Math.round(price*r.qty*100)/100;bySub[r.sub].dev+=amt;devAmt+=amt}
    }else{
      var pr=r.materialUnitPrice!=null&&r.materialUnitPrice!==''?Number(r.materialUnitPrice):null;
      if(pr==null){var mp=state.settings.materialPrices||{};pr=mp[r.name]!=null?Number(mp[r.name]):(mp[r.spec]!=null?Number(mp[r.spec]):null)}
      if(pr!=null){var amt2=Math.round(pr*r.qty*100)/100;bySub[r.sub].mat+=amt2;matAmt+=amt2}
    }
  });
  return {order:order.map(function(s){return {sub:s,dev:Math.round(bySub[s].dev*100)/100,mat:Math.round(bySub[s].mat*100)/100}}),devAmt:Math.round(devAmt*100)/100,matAmt:Math.round(matAmt*100)/100,total:Math.round((devAmt+matAmt)*100)/100};
}
/* 报价汇总 sheet 行（含调价系数与税率） */
function buildQuoteRows(quote,projName){
  var gp=state.settings.globalParams||{};
  var markup=gp.markup||1,tax=gp.tax||0;
  var finalAmt=Math.round(quote.total*markup*(1+tax/100)*100)/100;
  var rows=[['弱电智能化设计工作台 · 报价汇总',projName],
    ['系统','设备金额(元)','材料金额(元)','小计(元)']];
  quote.order.forEach(function(s){rows.push([s.sub,s.dev,s.mat,Math.round((s.dev+s.mat)*100)/100])});
  rows.push(['合计',quote.devAmt,quote.matAmt,quote.total]);
  rows.push(['调价系数',markup,'','']);
  rows.push(['税率',tax+'%','','']);
  rows.push(['含税总价',finalAmt,'','']);

  rows.forEach(function(r){

      brand=r.brand||'';model=r.model||'';tier=tierName(r.tier);param=r.param||'';price=r.unitPrice!=null&&r.unitPrice!==''?r.unitPrice:'';source=r.source||'';total=price!==''?Math.round(Number(price)*r.qty*100)/100:'';
      if(!brand&&!model&&!param&&!price){var dv=resolveDevice(billSubOf(r),r.name,r.deviceId),bp=dv&&devBrands[dv.id]&&devBrands[dv.id][0];if(bp){brand=bp.brand||'';model=bp.model||'';tier=tierName(bp.tier);param=bp.param||'';price=bp.unitPrice!=null?bp.unitPrice:'';source='默认型号';total=price!==''?Math.round(Number(price)*r.qty*100)/100:'';}}

/* ===== 按系统分组施工清单：每系统一组，兼容旧数据（无 sub 字段时按设备点表反查）===== */

    dv2.setUint16(14,dosDate,true);dv2.setUint32(16,crc,true);dv2.setUint32(20,f.data.length,true);
    dv2.setUint32(24,f.data.length,true);dv2.setUint16(28,nb.length,true);

/* 复制文本到剪贴板（navigator.clipboard 优先，textarea+execCommand 兜底） */

/* ============ 文件保存统一入口（v3 重写）============
   环境分流：
   ① iframe 沙箱（在线发布页）：showSaveFilePicker 被权限策略拒绝、程序化 a[download] 被 sandbox
      静默拦截 → 两路均无法落盘。改用「新顶级窗口下载」：window.open('') 打开的 about:blank
      窗口继承本页 origin（可使用本页 blob URL），且不受 iframe sandbox 的 downloads 限制；
      窗口内自动触发下载 + 显式「保存文件」按钮（真实用户手势，任何浏览器都不拦截）双保险。
   ② 顶级窗口（本地 file:// 打开）：优先系统"另存为"对话框（showSaveFilePicker），
      失败降级 a[download] 直接下载（blob → data URI 双路径）。
   ③ 新窗口被弹窗拦截器拦截：当前页弹窗内渲染可点击的下载链接（用户手势点击）+ 复制兜底。 */
function saveFile(filename,content,mime,tsvContent){
  if(inIframe()){
    if(downloadInNewWindow(filename,content,mime)){
      toast('已打开下载窗口，若未自动下载请点击其中「保存文件」按钮');
      return;
    }
    showDownloadLink(filename,content,mime,tsvContent);   // 新窗口被拦截 → 页内链接兜底
    return;
  }
  if(window.showSaveFilePicker){
    var pickType={accept:{},description:'文件'};
    if(/\.xlsx$/i.test(filename)){pickType={description:'Excel 文件',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}}
    else if(/\.csv$/i.test(filename)){pickType={description:'CSV 文件',accept:{'text/csv':['.csv']}}}
    else if(/\.json$/i.test(filename)){pickType={description:'JSON 文件',accept:{'application/json':['.json']}}}
    window.showSaveFilePicker({
      suggestedName:filename,
      types:[pickType],
      excludeAcceptAllOption:false
    }).then(function(handle){
      return handle.createWritable().then(function(w){
        return w.write(new Blob([content],{type:mime})).then(function(){return w.close()});
      });
    }).then(function(){
      toast('已保存到您选择的位置');
    }).catch(function(e){
      if(e&&e.name==='AbortError'){toast('已取消保存');return}
      directDownload(filename,content,mime,tsvContent);
    });
    return;
  }
  directDownload(filename,content,mime,tsvContent);
}
/* 新顶级窗口下载：绕过 iframe 沙箱对下载的限制
   - window.open('') 打开的空白窗口继承本页 origin，可使用本页创建的 blob URL
   - 顶级浏览上下文中 a[download] 不受 iframe sandbox 限制
   - 窗口内同时渲染显式「保存文件」按钮：用户亲手点击是最真实的用户手势，
     即使浏览器的自动下载被抑制，手动点击也 100% 触发保存 */
function downloadInNewWindow(filename,content,mime){
  var w=null;
  try{w=window.open('','_blank')}catch(e){}
  if(!w)return false;
  try{
    var blob=new Blob([content],{type:mime});
    var url=URL.createObjectURL(blob);
    var safeName=String(filename).replace(/"/g,'&quot;');
    var d=w.document;
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>文件下载</title></head>'+
      '<body style="margin:0;font-family:system-ui,\'Microsoft YaHei\',sans-serif;background:#f5f6f8;display:flex;align-items:center;justify-content:center;min-height:100vh">'+
      '<div style="text-align:center;padding:36px 46px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.09)">'+
      '<div style="font-size:34px;margin-bottom:10px">&#11015;</div>'+
      '<h3 style="margin:0 0 10px;font-size:17px;color:#eae7f5">文件下载</h3>'+
      '<p style="margin:0 0 20px;color:#a79dc5;font-size:13px;line-height:1.7;word-break:break-all">「'+safeName+'」已就绪<br>若未自动开始下载，请点击下方按钮手动保存</p>'+
      '<a id="dlBtn" href="'+url+'" download="'+safeName+'" style="display:inline-block;padding:11px 42px;background:#c2ef4e;color:#14102a;border-radius:8px;text-decoration:none;font-size:15px;font-weight:600;box-shadow:0 0 18px rgba(194,239,78,.35)">保存文件</a>'+
      '</div></body></html>');
    d.close();
    // 延迟自动触发一次下载（部分浏览器允许新窗口内程序化点击）
    setTimeout(function(){try{d.getElementById('dlBtn').click()}catch(e){}},80);
    // 延迟释放 blob URL（保留足够长时间供手动点击）
    setTimeout(function(){try{URL.revokeObjectURL(url)}catch(e){}},180000);
    return true;
  }catch(e){
    try{w.close()}catch(e2){}
    return false;
  }
}
/* 顶级窗口直接下载（a[download] 挂 DOM click；blob 失败再试 data URI） */
function directDownload(filename,content,mime,tsvContent){
  try{
    var blob=new Blob([content],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a)}catch(e){};URL.revokeObjectURL(url)},8000);
    toast('已开始下载，请查看浏览器下载栏');
    return;
  }catch(e){}
  if(typeof content!=='string'){showDownloadLink(filename,content,mime,tsvContent);return}  // 二进制内容（如 xlsx Blob）不走 data URI
  try{
    var dataUri='data:'+mime+';charset=utf-8,'+encodeURIComponent(content);
    var a2=document.createElement('a');
    a2.href=dataUri;a2.download=filename;a2.rel='noopener';a2.style.display='none';
    document.body.appendChild(a2);a2.click();
    setTimeout(function(){try{document.body.removeChild(a2)}catch(e){}},8000);
    toast('已开始下载，请查看浏览器下载栏');
  }catch(e){
    showDownloadLink(filename,content,mime,tsvContent);
  }
}
/* 页内下载链接弹窗：新窗口被弹窗拦截器拦截时的兜底（用户手势点击下载链接） */

  '<div class="card" style="margin:0;box-shadow:none;border:none">'+
  '<div class="fitem"><label>文件名</label><div>'+esc(filename)+'</div></div>'+
  '<div class="hint" style="margin:6px 0 14px">浏览器拦截了自动下载与新窗口。请直接点击下方按钮保存文件：</div>'+
  (url?'<a id="dlLink" href="'+url+'" download="'+esc(filename)+'" class="btn btn-primary" style="display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none">'+IC('dl')+'点击下载文件</a>'
      :'<div class="hint">当前环境无法生成下载链接，请使用「复制表格」</div>')+
  '</div><div class="dialog-foot">'+copyBtn+'<button class="btn btn-ghost" id="dgOk">关闭</button></div>');
  document.getElementById('dgX').onclick=closeDialog;
  document.getElementById('dgOk').onclick=closeDialog;
  var cp=document.getElementById('dgCopy');
  if(cp)cp.onclick=function(){
    copyTextToClipboard(tsvContent,function(ok){toast(ok?'已复制表格，粘贴到 Excel 即可（自动分列）':'复制失败')});
  };
  // 较长延时后释放 blob URL（期间用户可随时点击）
  setTimeout(function(){try{URL.revokeObjectURL(url)}catch(e){}},600000);
}

/* 导入 JSON：解析 → 摘要确认 → 自动备份当前数据 → 覆盖导入（取消则不变动） */
function importJSON(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var rd=new FileReader();rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d||typeof d!=='object'){toast('导入失败：文件格式不正确');return}
        var nP=(d.projects||[]).length,nPT=(d.points||[]).length,nDV=(d.devices||[]).length;
        var nST=d.settings?Object.keys(d.settings).length:0;
        // 自动备份当前数据（最近 1 份），支持导入后悔改回退
        lsSet('wb_elv_backup',{projects:state.projects,points:state.points,devices:state.devices,settings:state.settings,notes:notes,bills:bills,devBrands:devBrands,meta:meta,at:new Date().toISOString()});
        if(!confirm('即将导入：\n· 项目 '+nP+' 个\n· 设备点表 '+nPT+' 行\n· 设备字典 '+nDV+' 台\n· 系统配置 '+nST+' 项\n\n导入将覆盖当前数据，当前数据已自动备份（保留最近 1 份）。\n确认继续导入？'))return;
        if(d.projects)state.projects=d.projects;
        if(d.points)state.points=d.points;
        if(d.devices)state.devices=d.devices;
        if(d.settings)state.settings=d.settings;
        if(d.notes)notes=d.notes;else notes={};
        if(d.bills)bills=d.bills;else bills={};
        if(d.devBrands)devBrands=d.devBrands;else devBrands={};
        if(d.meta)meta=d.meta;
        ensureDeviceCodes();backfillPointDeviceIds();normalizeLegacyRatioTargets();ensureBusinessMeta();
        lsSet(LS_MT+'notes',notes);lsSet(LS_MT,meta);lsSet(LS_BILL,bills);lsSet(LS_BRAND,devBrands);
        saveAll().then(function(){toast('数据导入成功（导入前数据已备份）');render()});
      }catch(e){toast('导入失败：文件格式不正确')}
    };rd.readAsText(f);
  };inp.click();
}

/* 删除项目：确认时列出全部级联影响；同步清理该项目历史清单/设计说明/阶段日志，避免孤儿数据 */
function delProj(p){
  var ptN=state.points.filter(function(x){return x.项目ID===p.id}).length;
  var blN=normalizeBillList(bills[p.id]).length;
  var ntN=0;Object.keys(notes||{}).forEach(function(k){if(k.indexOf(p.id+'|')===0)ntN++});

/* 项目模版复制：完整复制项目配置 + 设备数量 + 设计说明 + 施工清单，副本完全独立 */
function copyProject(pid){
  var src=state.projects.find(function(x){return x.id===pid});
  if(!src){toast('项目不存在');return}
  var np={};
  Object.keys(src).forEach(function(k){np[k]=Array.isArray(src[k])?src[k].slice():src[k]});
  np.id=uid('prj');
  // 名称与编号唯一性：追加"副本"标记，冲突时递增序号
  var baseName=src.项目名称.replace(/（副本\d*）$/,'').replace(/\(副本\d*\)$/,'');
  var name=baseName+'（副本）',n=2;
  while(state.projects.some(function(x){return x.项目名称===name})){name=baseName+'（副本'+(n++)+'）'}
  np.项目名称=name;
  if(np.项目编号&&state.projects.some(function(x){return x.项目编号===np.项目编号})){
    var bc=src.项目编号.replace(/-\d+$/,''),m=2;
    var nc=bc+'-2';
    while(state.projects.some(function(x){return x.项目编号===nc})){nc=bc+'-'+(m++)}
    np.项目编号=nc;
  }
  np.状态='设计中';
  np.开始日期=todayStr();
  state.projects.push(np);
  // 复制设备数量（点位）
  state.points.filter(function(x){return x.项目ID===pid}).forEach(function(pt){
    var npt={};
    Object.keys(pt).forEach(function(k){npt[k]=Array.isArray(pt[k])?pt[k].slice():pt[k]});
    npt.id=uid('dq');npt.项目ID=np.id;npt.updatedAt=new Date().toISOString();
    state.points.push(npt);
  });
  // 复制设计说明（key: prjId|subsystem）
  Object.keys(notes).forEach(function(k){
    if(k.indexOf(pid+'|')===0)notes[np.id+k.slice(pid.length)]=notes[k];
  });
  // 复制施工清单（独立快照）
  if(bills[pid])bills[np.id]=bills[pid].slice();
  if(meta.billAt[pid])meta.billAt[np.id]=meta.billAt[pid];
  ensureBusinessMeta();if(meta.projectSelections[pid])meta.projectSelections[np.id]=JSON.parse(JSON.stringify(meta.projectSelections[pid]));if(meta.projectBudget[pid])meta.projectBudget[np.id]=JSON.parse(JSON.stringify(meta.projectBudget[pid]));if(meta.projectSchemes&&meta.projectSchemes[pid])meta.projectSchemes[np.id]=JSON.parse(JSON.stringify(meta.projectSchemes[pid]));
  lsSet(LS_BILL,bills);lsSet(LS_MT,meta);
  saveAll().then(function(){
    curProjId=np.id;curView='detail';render();
    toast('已复制为独立新项目「'+name+'」');
  });
}

/* ---------- 项目智能选型：项目默认档次 → 系统覆盖 → 设备例外 → 自动匹配 ---------- */

  cfg.deviceOverrides=cfg.deviceOverrides||{};

function normalizeBrandRule(x){
  x=x||{};

  return {
    brand:String(x.brand||''),
    model:String(x.model||''),
    tier:tierName(x.tier),
    param:String(x.param||''),
    unitPrice:Number(x.unitPrice)||0,
    techLevel:String(x.techLevel||x.level||''),
    minTier:tierName(x.minTier||'经济型'),
    allowAutoDowngrade:x.allowAutoDowngrade!==false,
    allowAutoModelSwitch:x.allowAutoModelSwitch!==false,
    critical:x.critical===true,
    brandRole:String(x.brandRole||'推荐品牌'),
    modelStatus:status,

  };
}
function ensureBrandLibrary(){
  state.settings=state.settings||{};
  state.settings.brands=Array.isArray(state.settings.brands)?state.settings.brands:[];
  var seen={};
  state.settings.brands=state.settings.brands.filter(function(b){return b&&String(b.name||'').trim()}).map(function(b){
    var name=String(b.name||'').trim(),key=name.toLowerCase();
    if(seen[key])return null;seen[key]=1;
    return {id:b.id||uid('br'),name:name,shortName:String(b.shortName||''),category:String(b.category||'未分类'),status:String(b.status||'启用')};
  }).filter(Boolean);
  // 从既有设备品牌价格数据自动迁移品牌库，避免升级后丢失已有品牌
  var by={};state.settings.brands.forEach(function(b){by[b.name]=b});
  Object.keys(devBrands||{}).forEach(function(did){(devBrands[did]||[]).forEach(function(x){var n=String(x.brand||'').trim();if(n&&!by[n]){by[n]={id:uid('br'),name:n,shortName:'',category:'未分类',status:'启用'};state.settings.brands.push(by[n])}})});
}
function brandNameList(){ensureBrandLibrary();return state.settings.brands.filter(function(b){return b.status!=='停用'}).map(function(b){return b.name})}
function subsystemBrandPool(s){
  if(!s)return [];
  return Array.isArray(s.brandPool)?s.brandPool.slice():[];
}
function normalizeSubsystemBrandPolicy(s){
  if(!s)return s;
  s.brandPool=subsystemBrandPool(s);s.defaultBrand=String(s.defaultBrand||'');
  return s;
}
function syncSubsystemBrandPolicies(){(state.settings.subsystems||[]).forEach(normalizeSubsystemBrandPolicy);}
function subsystemBrandOf(p,sub){
  var cfg=ensureSmartBudgetMeta(p),ss=(state.settings.subsystems||[]).find(function(x){return x.name===sub})||{},b=cfg.subsystemBrands[sub]||ss.defaultBrand||cfg.projectBrand||'';
  return String(b||'').trim();
}
function availableBrandsForSubsystem(p,sub){
  // 项目智能选型中的“可选品牌”应服务于人工切换，因此只要品牌在系统品牌池中、品牌库启用、
  // 且该系统至少有一个设备型号使用该品牌，就应显示；不再要求品牌先覆盖整个系统。
  // 是否“全系统完整覆盖”由候选预览和预算汇总提示，而不是把品牌从下拉框中提前隐藏。
  ensureBrandLibrary();syncSubsystemBrandPolicies();
  var ss=(state.settings.subsystems||[]).find(function(x){return x.name===sub});
  var pool=subsystemBrandPool(ss),poolSet={};pool.forEach(function(b){poolSet[String(b)]=1});
  var activeLib={};(state.settings.brands||[]).forEach(function(b){if(b.status!=='停用')activeLib[String(b.name)]=1});
  var seen={},out=[];
  state.points.filter(function(x){return x.项目ID===p.id&&x.子系统===sub}).forEach(function(pt){
    var d=resolveDeviceByPoint(pt);if(!d)return;
    (devBrands[d.id]||[]).map(normalizeBrandRule).filter(function(x){return x.active&&x.brand&&activeLib[String(x.brand)]&&(!pool.length||poolSet[String(x.brand)])}).forEach(function(x){if(!seen[x.brand]){seen[x.brand]=1;out.push(x.brand)}});
  });
  // 子系统品牌池中存在、但当前项目点表尚未形成对应型号记录的品牌也保留为可选，
  // 方便用户先切换品牌；选择后若存在缺失型号，预算区会明确提示需要维护数据库。
  if(pool.length){pool.forEach(function(b){if(activeLib[String(b)]&&!seen[String(b)]){seen[String(b)]=1;out.push(String(b))}})}

function commonBrandsForProject(p,subs){

    var ss=(state.settings.subsystems||[]).find(function(x){return x.name===sub})||{};

    if(pool.length)pool.forEach(function(b){if(brandNameList().indexOf(String(b))>=0)set[String(b)]=1});

    if(common===null)common=set;else Object.keys(common).forEach(function(b){if(!set[b])delete common[b]});

}
function autoBrandForSubsystem(p,sub,defaultTier,subTier,deviceTiers,brandHint){
  var ss=(state.settings.subsystems||[]).find(function(x){return x.name===sub})||{};
  if(brandHint)return brandHint;

    pts.forEach(function(pt){var d=resolveDeviceByPoint(pt);if(!d)return;var tier=tierName((deviceTiers&&deviceTiers[d.id])||subTier||defaultTier),c=candidateForTier(d,tier,b,'preview');if(!c){ok=false;return}total+=Number(c.unitPrice||0)*(Number(pt.数量)||0);roleScore += c.brandRole==='主品牌'?2:(c.brandRole==='推荐品牌'?1:0);});
    if(ok&&(!best||total<best.total||total===best.total&&roleScore>best.roleScore))best={brand:b,total:total,roleScore:roleScore};

function lockedSelectionFor(p,d){

function isRuleEligible(x,targetTier,mode){
  var want=tierIndex(targetTier),min=tierIndex(x.minTier||'经济型');
  if(want<min)return false;

  return true;

function techScore(v){var s=String(v||'').toLowerCase();if(/高|high|a/.test(s))return 3;if(/中|mid|medium|b/.test(s))return 2;if(/基础|低|basic|low|c/.test(s))return 1;return 0}
function candidateForTier(d,tier,brand,mode,excludeModel){
  var list=(devBrands[d.id]||[]).map(normalizeBrandRule).filter(function(x){return x.active&&(!brand||String(x.brand)===String(brand))&&(!excludeModel||String(x.model)!==String(excludeModel))});
  if(!list.length)return null;

function modelBySelection(d,sel){

function effectiveBudget(p,cfg){

function buildBudgetSnapshot(p,defaultTier,subTiers,deviceTiers,brandOpts,modelOpts){

    var sub=d.subsystem,tier=tierName(devs[d.id]||subs[sub]||tier0);
    if(autoBrands[sub]===undefined)autoBrands[sub]=autoBrandForSubsystem(p,sub,tier0,subs[sub]||'',devs,brands[sub]||cfg.projectBrand||'');
    var brand=(cfg.deviceBrandOverrides&&cfg.deviceBrandOverrides[d.id])||brands[sub]||subsystemBrandOf(p,sub)||autoBrands[sub]||cfg.projectBrand||'';
    var locked=lockedSelectionFor(p,d),cand=locked?modelBySelection(d,locked):(models[d.id]?modelBySelection(d,models[d.id]):candidateForTier(d,tier,brand,'preview'));
    var price=cand?Number(cand.unitPrice||0):0,amt=price*qty;devAmt+=amt;

/* 点表 CSV 解析：兼容逗号/中文逗号/Tab，自动跳表头；行=设备类型,数量,备注 */
function parsePointCSV(text){
  var rows=[];
  String(text||'').split(/\r?\n/).forEach(function(line,i){
    if(!line.trim())return;
    if(i===0&&line.indexOf('设备类型')>=0)return;
    var parts=line.split(/[,，\t]/).map(function(s){return s.trim()});
    var type=parts[0];if(!type)return;
    rows.push({设备类型:type,数量:parseInt(parts[1])||1,备注:parts[2]||''});
  });
  return rows;
}

  var csv='\ufeff'+toCSV(rows);

/* 导入点表 CSV：设备类型不在字典的跳过并计数 */
function importPointsCSV(p,sub){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.txt,text/csv';
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var rows=parsePointCSV(rd.result);
      if(!rows.length){toast('未解析到有效数据（格式：设备类型,数量,备注）');return}
      var has={};state.points.filter(function(x){return x.项目ID===p.id&&x.子系统===sub}).forEach(function(x){has[x.设备类型]=x});
      var add=0,upd=0,skip=0;
      rows.forEach(function(r){
        var dv=resolveDevice(sub,r.设备类型,null);
        if(!dv){skip++;return}
        var cur=has[r.设备类型];
        if(cur){cur.数量=r.数量;cur.备注=r.备注;cur.updatedAt=new Date().toISOString();cur['设备ID']=dv.id;upd++}
        else{state.points.push({id:uid('dq'),项目ID:p.id,子系统:sub,点位名称:'',安装位置:'',设备类型:r.设备类型,设备ID:dv.id,数量:r.数量,备注:r.备注,updatedAt:new Date().toISOString()});add++}
      });
      if(!add&&!upd){toast('导入完成：'+skip+' 条被跳过（设备类型不在字典）');return}
      saveAll().then(function(){toast('导入完成：新增 '+add+' 条，更新 '+upd+' 条'+(skip?'，跳过 '+skip+' 条（类型不在字典）':''));render()});
    };
    rd.readAsText(f,'utf-8');
  };
  inp.click();
}

function parseBrandBatchText(text,defaultBrand,defaultTier){

/* 兼容旧版品牌→型号→多参数结构：迁移为“品牌+型号唯一，对应单一参数和单价” */
function normalizeBrandPriceData(input){
  var out={},changed=false;
  Object.keys(input||{}).forEach(function(did){
    var arr=input[did]||[],rows=[];
    arr.forEach(function(b){
      if(b&&b.brand&&b.model){rows.push({id:b.id||uid('bp'),brand:b.brand,model:b.model,tier:tierName(b.tier),minTier:tierName(b.minTier||'经济型'),techLevel:String(b.techLevel||''),brandRole:String(b.brandRole||'推荐品牌'),modelStatus:String(b.modelStatus||'在售'),param:b.param||'',unitPrice:Number(b.unitPrice)||0,priceHistory:Array.isArray(b.priceHistory)?b.priceHistory.slice():[],allowAutoDowngrade:b.allowAutoDowngrade!==false,allowAutoModelSwitch:b.allowAutoModelSwitch!==false,critical:b.critical===true});return}
      (b&&b.models||[]).forEach(function(m){
        var ps=m.params||[];
        if(ps.length){var q=ps[0];rows.push({id:m.id||uid('bp'),brand:b.brand||'',model:m.model||'',tier:tierName(m.tier||b.tier),param:q.param||'',unitPrice:Number(q.unitPrice)||0});if(ps.length>1)changed=true;}
        else if(m.model)rows.push({id:m.id||uid('bp'),brand:b.brand||'',model:m.model,param:'',unitPrice:0});
      });
    });
    var seen={};out[did]=[];
    rows.forEach(function(r){var k=(r.brand+'|'+r.model).toLowerCase();if(seen[k]){changed=true;return}seen[k]=1;out[did].push(r)});
    if(JSON.stringify(arr)!==JSON.stringify(out[did]))changed=true;
  });
  return {data:out,changed:changed};
}
function migrateBrandPrices(){
  var r=normalizeBrandPriceData(devBrands);devBrands=r.data;
  if(r.changed)lsSet(LS_BRAND,devBrands);
  return r.changed;
}

function findDev(id){return state.devices.find(function(x){return x.id===id})}
/* 删除设备：被项目点表引用 → 禁止物理删除，改为归档（防孤儿数据）；无引用才可物理删除 */
function delDev(id){
  var d=findDev(id);if(!d)return;
  var refs=state.points.filter(function(x){return x['设备ID']===id||(!x['设备ID']&&x.子系统===d.subsystem&&x.设备类型===d.name)});
  if(refs.length){
    if(!confirm('设备「'+d.name+'」已被 '+refs.length+' 行项目点表引用，物理删除会造成历史数据悬空。\n\n改为「归档」？归档后新项目不可选，历史项目仍可查看与生成清单。'))return;
    d.status='归档';
    saveAll().then(render);
    toast('设备「'+d.name+'」已归档');
    return;
  }
  if(!confirm('确定删除设备「'+d.name+'」？'))return;
  state.devices=state.devices.filter(function(x){return x.id!==id});
  delete devSort[id];lsSet(LS_SORT,devSort);
  delete devBrands[id];lsSet(LS_BRAND,devBrands);
  saveAll().then(render);
}
/* 设备复制：完整复制设备全部字段（含单点定额/配比规则），生成独立新记录 */
function copyDev(id){
  var src=findDev(id);
  if(!src){toast('设备不存在');return}
  var nd={};
  Object.keys(src).forEach(function(k){
    var v=src[k];
    if(Array.isArray(v))nd[k]=v.map(function(o){return Object.assign({},o)});
    else if(v&&typeof v==='object')nd[k]=Object.assign({},v);
    else nd[k]=v;
  });
  nd.id=uid('dv');
  nd.code=''; // 副本使用全新编码（push 后由 ensureDeviceCodes 自动生成）
  // 同子系统内名称唯一：追加"副本"，冲突递增
  var baseName=src.name.replace(/（副本\d*）$/,'').replace(/\(副本\d*\)$/,'');
  var name=baseName+'（副本）',n=2;
  while(state.devices.some(function(x){return x.subsystem===nd.subsystem&&x.name===name})){name=baseName+'（副本'+(n++)+'）'}
  nd.name=name;
  devSort[nd.id]=sortedDevs(state.devices.filter(function(x){return x.subsystem===nd.subsystem})).length;
  lsSet(LS_SORT,devSort);
  // 复制品牌明细（深拷贝，独立记录）
  if(devBrands[id]){devBrands[nd.id]=JSON.parse(JSON.stringify(devBrands[id]))}
  else{devBrands[nd.id]=[]}
  lsSet(LS_BRAND,devBrands);
  state.devices.push(nd);
  ensureDeviceCodes();
  saveAll().then(function(){render();toast('已复制设备「'+name+'」')});
}

function onlineInit(){
  // 旧版本本地数据作废（以云端为准），同步清理旧版笔记缓存
  if((lsGet(LS_VER,0)||0)<APP_VER){lsSet(LS_P,[]);lsSet(LS_PT,[]);lsSet(LS_DV,[]);localStorage.removeItem(LS_MT+'notes');lsSet(LS_VER,APP_VER)}
  loadOnline().then(function(r){
    // lastSync 快照已建立，云端 diff 同步自此安全
    syncReady=true;
    // 云端存在旧版点位数据结构 → 清空点位表并重新初始化
    if(r.points.some(function(x){return x.点位名称&&String(x.点位名称).length})){
      return clearCloudTable('PT').then(function(){lastSync.PT={};return onlineInit()});
    }
    var hasData=r.projects.length||r.points.length||r.devices.length||r.stRecs.length;
    var localHas=lsGet(LS_P,[]).length||lsGet(LS_PT,[]).length||lsGet(LS_DV,[]).length;
    if(!hasData&&localHas){
      // 首次迁移：本地数据上传云端
      state.projects=lsGet(LS_P,[]);state.points=lsGet(LS_PT,[]);state.devices=lsGet(LS_DV,[]);
      var st=lsGet(LS_ST,null);state.settings=st||{subsystems:seedSubsystems(),globalParams:{lossRate:5,cableFactor:1.05,defaultStage:'施工图设计',markup:1,tax:0},buildingTypes:seedBuildingTypes(),subCategories:seedSubCategories(),brands:[],materialPrices:{},designQuotas:[],templates:[],designStages:['方案设计','初步设计','施工图设计','技术交底','竣工']};
      notes=lsGet(LS_MT+'notes',{});meta=lsGet(LS_MT,{seeded:false});bills=lsGet(LS_BILL,{});devSort=lsGet(LS_SORT,{});devBrands=lsGet(LS_BRAND,{});migrateBrandPrices();
      ensureDeviceCodes();backfillPointDeviceIds();
      return saveAll().then(function(){render()});
    }
    state.projects=r.projects;state.points=r.points;state.devices=r.devices;
    var cfg={subsystems:seedSubsystems(),globalParams:{lossRate:5,cableFactor:1.05,defaultStage:'施工图设计',markup:1,tax:0},buildingTypes:seedBuildingTypes(),subCategories:seedSubCategories(),brands:[],materialPrices:{},designQuotas:[],templates:[],designStages:['方案设计','初步设计','施工图设计','技术交底','竣工']};
    r.stRecs.forEach(function(x){if(x.配置键==='subsystems'&&x.配置值)cfg.subsystems=JSON.parse(x.配置值);
      if(x.配置键==='globalParams'&&x.配置值)cfg.globalParams=JSON.parse(x.配置值);
      if(x.配置键==='buildingTypes'&&x.配置值)cfg.buildingTypes=JSON.parse(x.配置值);
      if(x.配置键==='subCategories'&&x.配置值)cfg.subCategories=JSON.parse(x.配置值);
      if(x.配置键==='materialPrices'&&x.配置值)cfg.materialPrices=JSON.parse(x.配置值);
      if(x.配置键==='designQuotas'&&x.配置值)cfg.designQuotas=JSON.parse(x.配置值);
      if(x.配置键==='templates'&&x.配置值)cfg.templates=JSON.parse(x.配置值);
      if(x.配置键==='designStages'&&x.配置值)cfg.designStages=JSON.parse(x.配置值);
      if(x.配置键==='brands'&&x.配置值)cfg.brands=JSON.parse(x.配置值);
      if(x.配置键==='bills'&&x.配置值){try{bills=JSON.parse(x.配置值)||{}}catch(e){bills={}}}
      if(x.配置键==='devSort'&&x.配置值){try{devSort=JSON.parse(x.配置值)||{}}catch(e){devSort={}}}
      if(x.配置键==='deviceBrands'&&x.配置值){try{devBrands=JSON.parse(x.配置值)||{}}catch(e){devBrands={}}}
      if(x.配置键==='notes'&&x.配置值){try{notes=JSON.parse(x.配置值)||{}}catch(e){notes={}}}
      if(x.配置键==='meta'&&x.配置值){try{meta=JSON.parse(x.配置值)||{}}catch(e){meta={}}}});
    state.settings=cfg;ensureBrandLibrary();syncSubsystemBrandPolicies();ensureDesignQuotas();
    migrateBrandPrices();
    // 本地镜像
    lsSet(LS_P,state.projects);lsSet(LS_PT,state.points);lsSet(LS_DV,state.devices);lsSet(LS_ST,state.settings);lsSet(LS_BILL,bills);lsSet(LS_SORT,devSort);lsSet(LS_BRAND,devBrands);
    // 云端与本地均无项目数据 → 播种示例数据（保证首屏非空白）
    if(!r.projects.length&&!state.projects.length){
      state.projects=seedProjects();state.points=seedPoints();state.devices=seedDevices();
      notes=seedNotes();meta=seedMeta();
      lsSet(LS_MT+'notes',notes);lsSet(LS_MT,meta);
      saveAll().then(render);return;
    }
    // meta.seeded 标记为已播种（仅本地记录，不影响云端数据）
    if(!meta.seeded){meta.seeded=true;lsSet(LS_MT,meta)}
    normalizeLegacyRatioTargets();ensureBusinessMeta();lsSet(LS_MT,meta);
    if(pendingPush){
      pendingPush=false;
      toast('云端数据已加载完成；加载期间的操作已存本机，请重新执行一次以同步到云端。');
    }
    render();
  }).catch(function(){
    // 云端读取失败：不白屏、不静默——本地数据继续可用，横幅明确提示 + 可重试
    online=false;syncReady=false;
    localInit();render();
    showBanner('云端数据读取失败','已显示本地数据，可继续使用；请检查网络后点击重试重新同步。',function(){location.reload()});
  });
}
function boot(){
  renderNav();
  bindBanner();
  // 同步状态可点击：手动重新拉取云端（防多端数据不同步）
  var st=document.getElementById('syncText');
  if(st){st.style.cursor='pointer';st.title='点击重新从云端加载数据';st.onclick=refreshFromCloud;}
  // 加载占位：避免白屏等待
  var vb=document.getElementById('viewContainer');
  if(vb)vb.innerHTML='<div class="card" style="text-align:center;padding:44px;color:var(--text3)"><div style="margin-bottom:8px">'+IC('refresh')+'</div>正在加载数据…</div>';
  if(!hasSDK()){online=false;syncReady=false;localInit();render();setSync('off','离线模式');return}
  // 在线模式：先用本地缓存秒开渲染，后台同步云端刷新（避免等云端全量拉完才显示）
  var cached=lsGet(LS_ST,null);
  online=true;syncReady=false;pendingPush=false;
  setSync('busy','同步中…');
  if(cached&&cached.subsystems&&cached.subsystems.length){
    localInit();render();
  }
  onlineInit();
}
boot();

/* ============================================================
   暗色仪表盘 · 滚动动效（独立模块，不影响业务逻辑）
   ============================================================ */
(function(){
  var doc=document.documentElement, body=document.body;
  /* 顶部滚动进度条 */
  var bar=document.createElement('div');
  bar.id='scrollProg';
  bar.style.cssText='position:fixed;top:0;left:0;height:2px;width:0;z-index:9999;background:linear-gradient(90deg,#6a5fc1,#c2ef4e);box-shadow:0 0 12px rgba(194,239,78,.55);transition:width .08s linear;pointer-events:none';
  document.body.appendChild(bar);
  /* 背景光斑（随滚动位移） */
  var glow=document.createElement('div');
  glow.id='bgGlow';
  glow.style.cssText='position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 420px at 72% var(--gy,0px),rgba(106,95,193,.13),transparent 62%),radial-gradient(520px 340px at 26% var(--gy2,30vh),rgba(245,78,0,.06),transparent 62%)';
  document.body.appendChild(glow);
  var ticking=false;
  function onScroll(){
    if(ticking)return; ticking=true;
    requestAnimationFrame(function(){
      var max=doc.scrollHeight-doc.clientHeight;
      var y=doc.scrollTop||body.scrollTop||0;
      var p=max>0?y/max:0;
      bar.style.width=(p*100).toFixed(2)+'%';
      glow.style.setProperty('--gy',(y*0.18)+'px');
      glow.style.setProperty('--gy2',(y*0.10+window.innerHeight*0.25)+'px');
      ticking=false;
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  /* 视口渐入 + KPI 数字滚动 */
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.card,.stat-card,.proj-card,.bill-sum,.tbl-wrap,.stat-row,.tabs,.form-grid').forEach(function(el){el.classList.add('in')});
    return;
  }
  function rollNum(el){
    var txt=String(el.textContent).replace(/[^0-9.]/g,'');
    var target=parseFloat(txt)||0;
    if(!target)return;
    var t0=null,dur=650;
    function step(ts){
      if(!t0)t0=ts;
      var p=Math.min((ts-t0)/dur,1);
      var e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString();
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(!en.isIntersecting)return;
      var el=en.target;
      el.classList.add('in');
      io.unobserve(el);
      var num=el.querySelector('.stat-card .num, .num');
      if(num&&!num.dataset.rolled){num.dataset.rolled='1';rollNum(num);}
    });
  },{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.card,.stat-card,.proj-card,.bill-sum,.tbl-wrap,.stat-row,.tabs,.form-grid').forEach(function(el){
    el.classList.add('rv');
    io.observe(el);
  });
  /* 首屏元素立即入场 */
  setTimeout(function(){
    document.querySelectorAll('.rv:not(.in)').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.top<window.innerHeight*0.92){el.classList.add('in');io.unobserve(el);}
    });
  },80);
})();

/* ============================================================
   主题切换（白天/黑夜/随系统）· 独立模块
   状态存储：localStorage 'wb_elv_theme' = light|dark|system
   随系统：matchMedia('(prefers-color-scheme: light)') 实时监听
   ============================================================ */
(function(){
  var KEY='wb_elv_theme',root=document.documentElement;
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: light)'):null;
  function sysTheme(){return mq&&mq.matches?'light':'dark'}
  function readMode(){try{var m=localStorage.getItem(KEY);return (m==='light'||m==='dark'||m==='system')?m:'system'}catch(e){return 'system'}}
  function writeMode(m){try{localStorage.setItem(KEY,m)}catch(e){}}
  function apply(){
    var mode=readMode();
    var t=(mode==='system')?sysTheme():mode;
    root.setAttribute('data-theme',t);
    var sw=document.getElementById('themeSwitch');
    if(!sw)return;
    sw.querySelectorAll('button[data-mode]').forEach(function(b){
      var on=b.getAttribute('data-mode')===mode;
      b.classList.toggle('active',on);
      b.setAttribute('aria-pressed',on?'true':'false');
    });
  }
  if(mq&&mq.addEventListener){mq.addEventListener('change',function(){if(readMode()==='system')apply()})}
  else if(mq&&mq.addListener){mq.addListener(function(){if(readMode()==='system')apply()})}
  var sw=document.getElementById('themeSwitch');
  if(sw){sw.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('button[data-mode]'):null;
    if(!b)return;
    writeMode(b.getAttribute('data-mode'));apply();
  })}
  apply();
})();
</script>
